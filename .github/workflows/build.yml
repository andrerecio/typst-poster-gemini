name: build

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Compile poster
        run: typst compile --font-path fonts poster.typ poster.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: poster
          path: poster.pdf
